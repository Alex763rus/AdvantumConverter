<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Смена пароля</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css"/>
</head>
<body>
<h2>Смена пароля</h2>
<p>Ваш пароль был сброшен администратором. Установите новый пароль.</p>
<div th:if="${error}" class="error" th:text="${error}"></div>
<div th:if="${success}" class="logout" th:text="${success}"></div>
<form th:action="@{/change-password}" method="post">
    <input type="password" name="newPassword" placeholder="Новый пароль" required autofocus/>
    <input type="password" name="confirmPassword" placeholder="Повторите пароль" required/>
    <button type="submit">Сменить пароль</button>
</form>
</body>
</html>
